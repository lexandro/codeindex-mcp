name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # zig 0.13 cannot cross-compile CGo to macOS ("unable to create
      # compilation: AccessDenied", ziglang/zig#20689) - fixed in 0.14
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: "0.14.1"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          # --parallelism 1: concurrent zig cc cross-compiles race on the shared
          # compiler cache and fail with "unable to create compilation: AccessDenied"
          args: release --clean --parallelism 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIG_GLOBAL_CACHE_DIR: ${{ runner.temp }}/zig-global-cache
          ZIG_LOCAL_CACHE_DIR: ${{ runner.temp }}/zig-local-cache

  # The full-AST darwin binaries cannot be cross-linked from Linux (Go links
  # libresolv and Apple frameworks zig has no stubs for), so build them
  # natively on macOS and attach them to the release GoReleaser created.
  darwin-ast:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and upload darwin AST binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          for ARCH in arm64 amd64; do
            CGO_ENABLED=1 GOARCH="$ARCH" go build -tags ast -trimpath -ldflags "-s -w" -o codeindex-mcp-ast .
            ARCHIVE="codeindex-mcp-ast_${VERSION}_darwin_${ARCH}.tar.gz"
            tar -czf "$ARCHIVE" codeindex-mcp-ast LICENSE README.md
            rm codeindex-mcp-ast
          done
          gh release upload "$GITHUB_REF_NAME" codeindex-mcp-ast_*.tar.gz

      - name: Append darwin archives to checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --pattern checksums.txt
          shasum -a 256 codeindex-mcp-ast_*.tar.gz >> checksums.txt
          gh release upload "$GITHUB_REF_NAME" checksums.txt --clobber
